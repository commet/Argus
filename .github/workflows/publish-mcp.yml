name: Publish to MCP Registry

# One-tap registration of argus-decision-mcp's metadata in the official MCP
# Registry (registry.modelcontextprotocol.io) so hosts can discover it. Manual
# trigger only — press "Run workflow" in the Actions tab.
#
# npm publishing is deliberately NOT done here. The npm account requires a 2FA
# one-time password for publishing, which a CI token cannot supply (publishing
# from CI failed with EOTP). So the release is split:
#   1. Publish the package to npm out-of-band (locally, entering the OTP), OR via
#      whatever release path already puts versions on npm.
#   2. Run this workflow to register the matching version in the MCP Registry.
# The registry validates that npm already has server.json's version, so step 1
# must land before this runs. Auth here is GitHub OIDC (login github-oidc): the
# workflow runs inside commet/argus, so the io.github.commet/* namespace is
# accepted with no token or secret.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication to the registry
      contents: read
    defaults:
      run:
        working-directory: argus-mcp # server.json lives here (monorepo subfolder)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
