name: Publish to MCP Registry

# One-tap publish of argus-decision-mcp's metadata to the official MCP Registry
# (registry.modelcontextprotocol.io). The npm PACKAGE is published separately
# (already live at the version in argus-mcp/server.json); this only registers the
# server listing so hosts can discover it. Manual trigger only — press "Run
# workflow" in the Actions tab. Auth is GitHub OIDC: because this workflow runs
# inside the commet/argus repo, the registry accepts the `io.github.commet/*`
# namespace with no token or secret.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication to the registry
      contents: read
    defaults:
      run:
        working-directory: argus-mcp # server.json lives here (monorepo subfolder)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
