name: Auto detection eval (nightly)

# 생성 → 감지 → 판정 루프를 무인으로 돌린다. 현실적 다중 턴 대화를 대량 생성하고
# 실제 MCP 감지 메커니즘(서버 instructions + 진짜 툴 + tool_choice auto)에 흘려
# recall·over-fire·숨은전제 매치를 잰다. 라이브 키가 필요하므로 nightly + 수동.
# 결정론 스코어러는 auto-detect-eval.test.mjs가 매 PR(ci.yml 밖 수동)로 고정.
on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC nightly (argus-eval 06:00과 분리)
  workflow_dispatch:
    inputs:
      scenarios:
        description: '생성할 시나리오 수 (모드별 A/B로 각각 감지)'
        default: '3'
      concurrency:
        description: '동시 시나리오 수 (낮게 — rate limit 회피)'
        default: '1'
      profile:
        description: "full=전체, frozen=고정 벤치+판정기만(빠른 반복, 생성 eval·convo-sim 생략)"
        default: 'full'

jobs:
  auto-eval:
    runs-on: ubuntu-latest
    # 키 시크릿이 없으면 조용히 스킵 (argus-eval와 동일 관례).
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_DETECT_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 순수 로직 먼저 검증 (fixture, 키 불요) — 라이브 전 회귀 차단.
      - name: Unit tests (scorer + loop wiring + judge scoring, key-free)
        run: |
          node argus-plugin-v2/evals/detection/auto-detect-eval.test.mjs
          node argus-plugin-v2/evals/detection/convo-sim.test.mjs
          node argus-plugin-v2/evals/detection/validate-judge.test.mjs
          node argus-plugin-v2/evals/detection/run-agentic.test.mjs
          node argus-plugin-v2/evals/detection/validate-agentic.test.mjs
      # 판정기부터 검증한다(Stage 2): hidden_extraction 지표를 신뢰하려면 채점자가
      # gold를 match하고 counter를 reject해야 한다. 임계 미달이면 exit 2 → 이 run의
      # 추출 숫자를 믿지 말고 판정기부터 고치라는 신호(theater 방지). 게이트라 먼저.
      - name: Validate the judge (gold→match, counter→reject)
        run: node argus-plugin-v2/evals/detection/validate-judge.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_MIN_DELAY_MS: '2500'
          RUN_STAMP: ${{ github.run_id }}
      - name: Run auto detection eval
        if: ${{ github.event.inputs.profile != 'frozen' }}
        run: node argus-plugin-v2/evals/detection/auto-detect-eval.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_SCENARIOS: ${{ github.event.inputs.scenarios || '3' }}
          AUTO_CONCURRENCY: ${{ github.event.inputs.concurrency || '1' }}
          AUTO_MIN_DELAY_MS: '2500'
          RUN_STAMP: ${{ github.run_id }}
      # 고정 벤치마크 + 래칫 — 매 라운드 같은 31케이스(사람 라벨)로 양 모드 실측.
      # Stage 2부터 추출 품질(hidden_extraction.matched)도 gold 대조로 재고 래칫한다.
      # 베이스라인 대비 회귀면 exit 2 → job이 loud하게 빨간불, 루프가 revert.
      - name: Frozen benchmark ratchet (fixed 31-case corpus, both modes)
        run: node argus-plugin-v2/evals/detection/frozen-bench.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_STAMP: ${{ github.run_id }}
      # 진짜 다중 턴 루프 + 정산 라이더 시뮬(Stage 1) — 단발 하네스가 못 재던
      # 라이더 정산 효과를 실측. 래칫은 아직 없음(측정치 수집 단계).
      - name: Convo-sim (real multi-turn loop + settlement rider)
        if: ${{ github.event.inputs.profile != 'frozen' }}
        run: node argus-plugin-v2/evals/detection/convo-sim.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONVO_SCENARIOS: '4'
          CONVO_CONCURRENCY: '1'
          AUTO_MIN_DELAY_MS: '2500'
          RUN_STAMP: ${{ github.run_id }}
      # ── 깊은 agentic 축 (R24, 정보용·비게이팅) ──────────────────────────────
      # overload/technical 판정기가 이 코퍼스의 distractor/counter를 기각하는지
      # 먼저 검증(theater 방지). continue-on-error: 새 축이라 아직 게이팅 안 함 —
      # 첫 실측 후 R25에서 baseline+래칫으로 승격. API 오류는 스크립트가 스킵.
      - name: Agentic judge validation (informational)
        if: ${{ github.event.inputs.profile != 'frozen' }}
        continue-on-error: true
        run: node argus-plugin-v2/evals/detection/validate-agentic.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_MIN_DELAY_MS: '2500'
          RUN_STAMP: ${{ github.run_id }}
      # 깊은 세션을 실제 감지기에 흘려 5개 축(overload/technical/pacing/timing/
      # ethical)을 실측. 비게이팅 — 첫 숫자를 얻어 R25에서 래칫 편입.
      - name: Agentic axes (informational)
        if: ${{ github.event.inputs.profile != 'frozen' }}
        continue-on-error: true
        run: node argus-plugin-v2/evals/detection/run-agentic.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_MIN_DELAY_MS: '2500'
          AGENTIC_CONCURRENCY: '1'
          RUN_STAMP: ${{ github.run_id }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-detect-report
          path: |
            argus-plugin-v2/evals/detection/auto-detect-report.json
            argus-plugin-v2/evals/detection/auto-detect-trend.jsonl
            argus-plugin-v2/evals/detection/frozen-bench-report.json
            argus-plugin-v2/evals/detection/validate-judge-report.json
            argus-plugin-v2/evals/detection/convo-sim-report.json
            argus-plugin-v2/evals/detection/agentic-report.json
          retention-days: 30
