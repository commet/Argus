name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 수동 트리거 (2026-07-28): Actions 이벤트가 이 레포에서 멈춰 PR에 CI가 아예
  # 안 뜬 적이 있다. "초록이 없다"와 "빨간불이다"를 구분할 수 없으면 남는 건
  # 로컬 재현뿐이다. 버튼 하나를 남겨둔다.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # argus-decision-mcp lives under argus-mcp/ as a separate package (not an
      # npm workspace); install it before root tests that import its MCP copy.
      # Fall back to `npm install` if `npm ci` trips on a floating optional native
      # dep: a transitive `@emnapi/*` (^-ranged) can publish a new patch while the
      # committed lock pins the prior one, so strict `npm ci` fails non-
      # deterministically by runner npm version. `npm install` resolves it fresh.
      - run: npm ci --prefix argus-mcp || npm install --prefix argus-mcp

      - name: Argus decision MCP package
        run: |
          cd argus-mcp
          npm run typecheck
          npm test
          npm audit --omit=dev
          npm pack --dry-run

      # 진짜 끝단 게이트 (2026-07-24, 창업자 지시 "기본이 안 됐던 걸 잡아라"):
      # 단위테스트는 모킹된 픽커만 본다 — 이 스텝은 실제 서버 프로세스를 stdio로
      # spawn하고 elicitation capability를 선언한 진짜 MCP 클라이언트로 예측/전제
      # 픽커 왕복(keep·reword·skip)과 check_in picker 가시화를 실증한다. 이게
      # 빨간불이면 "테스트는 초록인데 실물이 침묵"하는 그 실패가 재발한 것이다.
      - name: E2E picker round-trip (real stdio server + real elicitation)
        run: |
          cd argus-mcp
          npm run build
          node evals/e2e-picker.mjs node "$PWD/dist/index.js"

      # 사용자와 **같은 경로**로 한 번 더 (2026-07-26, 창업자 지시 "정확한 배선").
      # 위 스텝은 레포의 dist/를 직접 띄운다 — 그건 개발자 경로다. 사용자는
      # 패킹된 타르볼이 설치된 bin을 npx로 받는다. 그 경로에서만 드러나는 실패가
      # 실재한다: package.json `files` 누락으로 런타임 파일이 안 실리거나, bin
      # 진입점이 깨지거나, 배선 버전 보고가 설치본에서 어긋나는 것.
      #
      # 근원 사건: `argus-decision-mcp@^1`(범위 스펙)이 npx 캐시에 1.2.0을
      # 앉힌 뒤 7개 릴리스가 npm에 올라가는 12일간 창업자 배선이 얼어 있었다.
      # 레포 게이트는 전부 초록이었다 — 레포가 자기 자신과 일관됐기 때문이다.
      # 이 스텝은 "설치된 것"을 검사 대상으로 삼아 그 종류의 침묵을 없앤다.
      - name: E2E on the packed tarball (the path a user actually installs)
        run: |
          cd argus-mcp
          TARBALL="$(npm pack --silent)"
          INSTALL_DIR="$(mktemp -d)"
          cd "$INSTALL_DIR"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/argus-mcp/$TARBALL"
          BIN="$INSTALL_DIR/node_modules/argus-decision-mcp/dist/index.js"
          test -f "$BIN" || { echo "설치본에 진입점이 없다: $BIN (package.json files 누락?)"; exit 1; }
          node "$GITHUB_WORKSPACE/argus-mcp/evals/e2e-picker.mjs" node "$BIN"

      # 호스트 전수 대조 (2026-07-27, 창업자 지시 "죄다 다시 다 체크"): 두 번의
      # 차단 사고가 모두 "우리 하네스는 받아주는데 사용자의 클라이언트는 막는다"의
      # 틈에서 났다. 이 스텝은 claude-code / claude-desktop / codex / legacy /
      # 적대(취소·빈답·쓰레기답) 7개 호스트를 각각 흉내내 실서버를 몰고, 모든
      # 물음에 대해 막다름 0·작업유실 0·폼차단 0을 단정한다. 알려진 두 회귀를
      # 되살리면 실제로 빨간불이 뜬다(자기 신뢰성 검증됨).
      # 정산 카드의 자바스크립트는 .ts 안의 문자열이라 tsc가 못 본다. 적대 감사가
      # 문법 오류·오타 도구명·런타임 예외를 심었을 때 레포의 모든 게이트가 초록이었다
      # — 아무도 실행해본 적 없는 위젯을 배포한 것이다. 이 스텝이 VM에서 실제로
      # 실행하고 사용자 제스처(선택·타이핑·기록·넘기기·연기·서버거절)를 전부 몬다.
      - name: Settle card runtime (executed in a VM host)
        run: |
          cd argus-mcp
          node evals/widget-runtime.mjs

      # 원장을 읽을 수 없을 때 "기록 없음"이라 답하며 이중 봉인까지 허용하던 구멍
      # (적대 감사 2026-07-27). 쓰기는 멈추고, 기록은 손대지 않는다.
      # 아래 세 스텝은 2.0.0에서 지워졌던 관측소를 **되살린 게 아니라 옮긴** 것이다.
      # 삭제 사유는 "없어진 별칭을 부르니 제품 그림이 거짓"이었고 그 판단은 옳았다.
      # 그래서 공개 6도구 이름(argus_predict / argus_resolve / argus_capture /
      # argus_patterns)으로 다시 짜서, 같은 사실을 지금 있는 표면에 대고 묻는다.
      # 이것들이 없으면 2026-07-28 감사 수리 중 어느 것도 증명되지 않는다.
      - name: Host conformance matrix (real client profiles x every ask)
        run: |
          cd argus-mcp
          HOST_MATRIX_SKIP_BUILD=1 node evals/host-matrix.mjs

      # 밖에서 뜨는 물음은 사용자가 부르지 않은 유일한 표면인데 eval이 없었다.
      - name: Out-of-band ask (real server, 8 promises)
        run: |
          cd argus-mcp
          AMBIENT_SKIP_BUILD=1 node evals/ambient-picker.mjs

      # 내용 배터리: 형식이 아니라 내용 — 다양한 도메인·양쪽 언어·적대 입력·모든
      # 픽커 출구. 스파인 문구 위조 결함이 여기서 잡혔다.
      - name: Content battery (real server, diverse content)
        run: |
          cd argus-mcp
          BATTERY_SKIP_BUILD=1 node evals/battery.mjs

      # 픽커와 문구는 사람이 읽는 화면이다. 2026-07-28까지 어떤 게이트도 "동작하나"만
      # 물었고 "읽을 수 있나"는 묻지 않았다 — 그 사이 모든 입력 칸이 내부 키 이름으로
      # 라벨링돼 있었다. 아래 둘은 두 언어 × 여러 내용 모양으로 실서버를 몰아
      # 라벨 부재·언어 혼입·깨진 보간·폼 차단을 단정한다.
      - name: Picker surfaces (2 locales x 8 content shapes)
        run: |
          cd argus-mcp
          PICKER_SURFACES_SKIP_BUILD=1 node evals/picker-surfaces.mjs
      - name: Surface hazards (2 locales x picker/no-picker hosts)
        run: |
          cd argus-mcp
          SURFACE_HAZARDS_SKIP_BUILD=1 node evals/surface-hazards.mjs

      # 진짜 Codex를 설치해 진짜 승인 정책 두 개로 몬다. 정책이 화면을 안 띄우고
      # 스스로 decline하는 경우(approval_policy="never" / granular
      # .mcp_elicitations=false)를 하네스가 흉내내는 게 아니라 Codex가 직접
      # 만들게 한다 — 자기가 만든 실패를 자기가 잡는 하네스는 하네스만 증명한다.
      # codex가 없으면 이 스텝은 소리내어 건너뛴다(초록 위장 금지).
      - name: Real Codex app-server (allowed / policy-blocked)
        run: |
          npm i -g @openai/codex@0.130.0-alpha.5
          cd argus-mcp
          CODEX_APP_SERVER_SKIP_BUILD=1 node evals/codex-app-server.mjs

      # 설치 스모크가 실제 Claude Code lifecycle(마켓플레이스 추가 → 설치 →
      # 인벤토리 → MCP 연결 → 비활성/활성/업데이트 → 제거)을 돌게 하려면 CLI가
      # 있어야 한다. 없으면 스크립트가 소리내어 건너뛰므로 여기서 깔아둔다 —
      # 안 그러면 게이트가 조용히 매니페스트 읽기 수준으로 퇴화한다.
      - name: Claude Code CLI (for the plugin install lifecycle)
        # --allow-scripts, and pinned. npm 11 blocks dependency install scripts,
        # and Claude Code's native binary comes from its own postinstall — a
        # plain `npm i -g` there leaves a `claude` that cannot run, the smoke
        # skips loudly, and the lifecycle silently stops being tested. Same form
        # the publish workflow already proved.
        run: npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.220
        continue-on-error: true

      - name: Unreadable ledger refuses writes
        run: |
          cd argus-mcp
          UNREADABLE_SKIP_BUILD=1 node evals/unreadable-ledger.mjs

      # install-smoke drives Claude Code's real plugin manager and MCP health
      # check in an isolated config. Pin the host version whose form submit
      # behavior is also read by claude-code-form.mjs; "latest" would make a
      # host rollout silently change the meaning of this gate.
      - name: Install tested Claude Code host
        run: npm install -g @anthropic-ai/claude-code@2.1.220

      # The Codex gate drives the actual app-server JSON-RPC bridge, not a
      # Codex-shaped mock. Keep the host version explicit so a rollout changes
      # this contract in a visible dependency update.
      - name: Install tested Codex host
        run: npm install -g @openai/codex@0.130.0-alpha.5

      # 상시 센서 (2026-07-27 창업자 지시 "eval을 꼼꼼하게 — 사고 나면 결국
      # 모델에게 시킬 텐데 센서가 없으면 못 찾는다"): 실서버를 stdio로 몰아
      # 모든 표면을 계약·스파인 검사로 훑는다. RED = 병합 차단.
      - name: Final MCP and plugin surface
        run: |
          cd argus-mcp
          npm run verify

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/

      # Single full-suite run WITH coverage — the v8 instrumentation reports every
      # test, so a separate plain `vitest run` would just double CI time.
      # Coverage RATCHET: thresholds in vitest.config.ts sit a few points below the
      # measured baseline, so this fails only if coverage *erodes*. Raise the floor
      # as new tests land — see internal design notes (Gap 4).
      - name: Test + coverage ratchet
        run: npx vitest run --coverage --reporter=verbose
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Argus spine eval — STATIC layer (deterministic, no API key). Gates every PR
      # on the gross zero-judgment violations. The live LLM-judged layer runs
      # nightly in argus-eval.yml. See argus-plugin-v2/evals/README.md.
      - name: Argus spine static gate
        run: node argus-plugin-v2/evals/static-gate.test.mjs

      # Enforcement gates — the architectural check that the verify / route-contract /
      # flat gates hold in session artifacts (prose rules are a floor, not enforcement).
      - name: Argus enforcement gates
        run: node argus-plugin-v2/scripts/validate-gates.test.mjs

      # Detection prefilter skip-safety — the labeled-corpus gate. The prefilter may
      # never skip a labeled positive (a skipped positive = a turn where the AI
      # diagnosis is never injected = a silent detection blind spot).
      - name: Argus detection corpus gate
        run: node argus-plugin-v2/evals/detection/measure.test.mjs

      # Agentic coding-session corpus integrity — the deep-eval tier's gold labels
      # (overload/pacing/technical/timing/ethical) must stay well-formed so the
      # live judge harness (next round) can trust them. Key-free structural gate.
      - name: Argus agentic corpus integrity
        run: node argus-plugin-v2/evals/detection/corpus-agentic.test.mjs

      # Agentic axis scorers + judge-probe construction (deep-eval R24) — pure
      # logic, key-free. The live judged run lives in auto-detect-eval.yml.
      - name: Argus agentic scorers
        run: |
          node argus-plugin-v2/evals/detection/run-agentic.test.mjs
          node argus-plugin-v2/evals/detection/validate-agentic.test.mjs

      # Every-turn conversation-diagnosis hook (sense-signal): injection contract,
      # transcript window, caps, outcome-only path, opt-out.
      - name: Argus sense hook
        run: node argus-plugin-v2/scripts/sense-signal.test.mjs

      # Enforcement is a HARD BLOCK, not advisory (CLI exits non-zero on a violation).
      - name: Argus enforcement hard-block
        run: node argus-plugin-v2/scripts/enforcement-hardblock.test.mjs

      # Secret redaction (the mechanical version of clarify's "redact before use").
      - name: Argus secret redaction
        run: node argus-plugin-v2/scripts/redact.test.mjs

      # Single-source ledger writers (plugin-core Option A): record/amend/settle
      # emit the canonical shape the readers replay, so a skill can't hand-write a
      # drifting line. Functional test spawns the CLI and asserts the JSONL.
      - name: Argus ledger writers
        run: node argus-plugin-v2/scripts/decision-ledger.test.mjs

      # Effortless webapp connect (BLUEPRINT §9.9 V1): the plugin `connect` runs an
      # OAuth device/browser flow instead of a pasted PAT, and `push --ensure-connect`
      # auto-opens the approve tab on first seal. Black-box test drives the device
      # flow against a fake OAuth+ingest server and pins the spine restraint (a
      # declined auto-tab is never re-opened; explicit connect clears the decline).
      - name: Argus webapp connect flow
        run: node argus-plugin-v2/scripts/push-webapp.test.mjs

      # SessionStart reminder hook (check-contracts.js): the overdue-contract and
      # living-premises reminders. Gated so a command rename can't silently rot the
      # reminder copy again (this test lagged the settle→resolve / track→premises
      # rename because it wasn't wired here).
      - name: Argus reminder hook
        run: node argus-plugin-v2/scripts/test-check-contracts.mjs

      # Real clean install in an isolated CLAUDE_CONFIG_DIR: install, inventory,
      # MCP connection, disable/enable/update, and uninstall.
      - name: Argus install smoke
        run: node argus-plugin-v2/scripts/install-smoke.mjs

      # Single-source generation: generated cross-surface artifacts must match their
      # JSON source (drift prevention, not just detection).
      - name: Argus generated-contract sync
        run: node argus-plugin-v2/scripts/generate-contracts.test.mjs

      # doctor [10] 캐시 줄이 정확 핀에서 무해한 사본에 겁주지 않는지 (2026-07-27 도그푸딩).
      - name: Argus doctor cache-noise contract
        run: node argus-plugin-v2/scripts/doctor-cache-noise.test.mjs

      # Plugin structure + bearing simulations.
      # 확인 표면(data.picker)은 서버가 값을 늘려도 플러그인이 안 늘면 조용히
      # 사라진다 — 1.15.0의 `card`가 정확히 그랬다.
      - name: Argus picker-surface parity
        run: node argus-plugin-v2/scripts/picker-surface-parity.test.mjs

      - name: Argus plugin validate
        run: node argus-plugin-v2/scripts/validate-plugin.js && node argus-plugin-v2/scripts/simulate-plugin.js
