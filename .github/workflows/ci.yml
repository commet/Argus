name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # argus-decision-mcp lives under argus-mcp/ as a separate package (not an
      # npm workspace); install it before root tests that import its MCP copy.
      # Fall back to `npm install` if `npm ci` trips on a floating optional native
      # dep: a transitive `@emnapi/*` (^-ranged) can publish a new patch while the
      # committed lock pins the prior one, so strict `npm ci` fails non-
      # deterministically by runner npm version. `npm install` resolves it fresh.
      - run: npm ci --prefix argus-mcp || npm install --prefix argus-mcp

      - name: Argus decision MCP package
        run: |
          cd argus-mcp
          npm run typecheck
          npm test
          npm audit --omit=dev
          npm pack --dry-run

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/

      # Single full-suite run WITH coverage — the v8 instrumentation reports every
      # test, so a separate plain `vitest run` would just double CI time.
      # Coverage RATCHET: thresholds in vitest.config.ts sit a few points below the
      # measured baseline, so this fails only if coverage *erodes*. Raise the floor
      # as new tests land — see internal design notes (Gap 4).
      - name: Test + coverage ratchet
        run: npx vitest run --coverage --reporter=verbose
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Argus spine eval — STATIC layer (deterministic, no API key). Gates every PR
      # on the gross zero-judgment violations. The live LLM-judged layer runs
      # nightly in argus-eval.yml. See argus-plugin-v2/evals/README.md.
      - name: Argus spine static gate
        run: node argus-plugin-v2/evals/static-gate.test.mjs

      # Enforcement gates — the architectural check that the verify / route-contract /
      # flat gates hold in session artifacts (prose rules are a floor, not enforcement).
      - name: Argus enforcement gates
        run: node argus-plugin-v2/scripts/validate-gates.test.mjs

      # Detection prefilter skip-safety — the labeled-corpus gate. The prefilter may
      # never skip a labeled positive (a skipped positive = a turn where the AI
      # diagnosis is never injected = a silent detection blind spot).
      - name: Argus detection corpus gate
        run: node argus-plugin-v2/evals/detection/measure.test.mjs

      # Agentic coding-session corpus integrity — the deep-eval tier's gold labels
      # (overload/pacing/technical/timing/ethical) must stay well-formed so the
      # live judge harness (next round) can trust them. Key-free structural gate.
      - name: Argus agentic corpus integrity
        run: node argus-plugin-v2/evals/detection/corpus-agentic.test.mjs

      # Every-turn conversation-diagnosis hook (sense-signal): injection contract,
      # transcript window, caps, outcome-only path, opt-out.
      - name: Argus sense hook
        run: node argus-plugin-v2/scripts/sense-signal.test.mjs

      # Enforcement is a HARD BLOCK, not advisory (CLI exits non-zero on a violation).
      - name: Argus enforcement hard-block
        run: node argus-plugin-v2/scripts/enforcement-hardblock.test.mjs

      # Secret redaction (the mechanical version of clarify's "redact before use").
      - name: Argus secret redaction
        run: node argus-plugin-v2/scripts/redact.test.mjs

      # Single-source ledger writers (plugin-core Option A): record/amend/settle
      # emit the canonical shape the readers replay, so a skill can't hand-write a
      # drifting line. Functional test spawns the CLI and asserts the JSONL.
      - name: Argus ledger writers
        run: node argus-plugin-v2/scripts/decision-ledger.test.mjs

      # Effortless webapp connect (BLUEPRINT §9.9 V1): the plugin `connect` runs an
      # OAuth device/browser flow instead of a pasted PAT, and `push --ensure-connect`
      # auto-opens the approve tab on first seal. Black-box test drives the device
      # flow against a fake OAuth+ingest server and pins the spine restraint (a
      # declined auto-tab is never re-opened; explicit connect clears the decline).
      - name: Argus webapp connect flow
        run: node argus-plugin-v2/scripts/push-webapp.test.mjs

      # SessionStart reminder hook (check-contracts.js): the overdue-contract and
      # living-premises reminders. Gated so a command rename can't silently rot the
      # reminder copy again (this test lagged the settle→resolve / track→premises
      # rename because it wasn't wired here).
      - name: Argus reminder hook
        run: node argus-plugin-v2/scripts/test-check-contracts.mjs

      # Clean-install preconditions (manifest parity, skills/agents/hooks/schemas resolve).
      - name: Argus install smoke
        run: node argus-plugin-v2/scripts/install-smoke.mjs

      # Single-source generation: generated cross-surface artifacts must match their
      # JSON source (drift prevention, not just detection).
      - name: Argus generated-contract sync
        run: node argus-plugin-v2/scripts/generate-contracts.test.mjs

      # Plugin structure + bearing simulations.
      - name: Argus plugin validate
        run: node argus-plugin-v2/scripts/validate-plugin.js && node argus-plugin-v2/scripts/simulate-plugin.js
