# Bounded deep-review routing. Standard Argus does not use reviewers.

stakes:
  routine:
    description: "Low-impact and easily reversible."
    reviewer_count_max: 1
    roles: [domain-reviewer]

  important:
    description: "Meaningful but reversible."
    reviewer_count_max: 2
    roles: [domain-reviewer, evidence-reviewer]
    note: "Use evidence-reviewer only when factual claims are load-bearing."

  critical:
    description: "High-impact, irreversible, or expensive to undo."
    reviewer_count_max: 3
    roles: [domain-reviewer, evidence-reviewer, risk-reviewer]
    mandates: [risk-review]

decision_types:
  known_path:
    description: "The path is known; inspect execution constraints."
  needs_analysis:
    description: "The problem is defined but the solution is uncertain."
  no_answer:
    description: "The problem or evidence is still ambiguous."
  on_fire:
    description: "Urgent and time-constrained."

runtime_instructions: |
  Classify stakes as routine, important, or critical.
  Default to important when unclear. Use critical only for a credible
  irreversible or high-impact consequence.

  Keep the plan bounded:
  - routine: domain-reviewer only;
  - important: domain-reviewer plus evidence-reviewer only when needed;
  - critical: the same specialists plus one risk-reviewer pass.

  Never create a debate, vote, persona council, or recursive review.
  Preserve uncertainty and human-required checks in the final synthesis.
