# Argus plugin config template.
# Copy to `.argus/config.yaml` in your repo and customize.
# Schema: data/schemas/config.json (bundled with the Argus plugin)
#
# On first `/argus:sail` invocation, if .argus/config.yaml is missing, it is
# silently auto-created from this template (NO setup dialog) and sail substitutes
# the detected locale (and an English boss persona when locale resolves to "en").
# Edit this file afterward to customize. There is intentionally no first-run prompt.

locale: ko  # or "en" — sail Step 0 overwrites this with the detected locale on auto-create

boss:
  mbti_code: ISTJ  # Must match an entry in the plugin's data/boss-types.yaml. See choices:
                   # ISTJ, ISFJ, INFJ, INTJ, ISTP, ISFP, INFP, INTP,
                   # ESTP, ESFP, ENFP, ENTP, ESTJ, ESFJ, ENFJ, ENTJ
  name: "박 팀장"
  gender: 남       # "남" | "여" (KR) or "male" | "female" (EN)
  role: "팀장"     # Free-form role label

team:
  # Optional overrides. Omit unless you need them.
  # max_agents_override: 3
  # preferred_agents: [donghyuk, jieun]

archive:
  commit_sessions: false  # If true, /argus:versions suggests git commit at phase=complete
