# Argus plugin config template.
# Copy to `.argus/config.yaml` in your repo and customize.
# Schema: data/schemas/config.json (bundled with the Argus plugin)
#
# On first `/argus:review` invocation, if .argus/config.yaml is missing, it is
# silently auto-created from this template (NO setup dialog) and the pipeline
# substitutes the detected locale (and an English boss persona when locale
# resolves to "en"). Edit this file afterward to customize. There is
# intentionally no first-run prompt.

locale: ko  # or "en" — pipeline Step 0 overwrites this with the detected locale on auto-create

boss:
  # SEAT-FIRST (R42): the review's value comes from what this stakeholder is
  # accountable for — never from a personality type.
  name: "박 팀장"
  role: "팀장"     # The chair they sit in (free text)
  owns: "팀 분기 로드맵과 서비스 안정성"        # What the seat is accountable for — highest-value field
  goals: "이번 분기 신뢰성 사고 0건, 일정 준수"  # Current priorities (optional)
  authority: "머지·배포 승인과 일정 조정. 예산·인사는 상신."  # Approve/refuse vs escalate (optional)
  gender: 남       # "남" | "여" (KR) or "male" | "female" (EN)
  tone: ISTJ       # OPTIONAL voice skin from data/boss-types.yaml (16 codes) — HOW it speaks,
                   # never WHY it objects. Legacy key `mbti_code` still works and means the same.

team:
  # Optional overrides. Omit unless you need them.
  # max_agents_override: 3
  # preferred_agents: [domain-reviewer, evidence-reviewer]

archive:
  commit_sessions: false  # If true, /argus:history versions suggests git commit at phase=complete
